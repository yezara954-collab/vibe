class FrameMeter {
 constructor(){this.names=['背景','树','人物','瓶子','雨','辉光','倒影投影','粒子','音频'];this.current=new Float64Array(9);this.mean=new Float64Array(9);this.fps=60;this.ms=16.67;this.elapsed=0;this.count=0;this.work=0;this.visible=false;this.panel=document.createElement('pre');this.panel.style.cssText='position:absolute;z-index:8;left:8px;bottom:12px;color:white;background:#00184edc;padding:10px;font:11px/1.6 monospace;pointer-events:none;display:none';stage.appendChild(this.panel);}

// 广泛支持的路径绘制；不依赖较新的 roundRect 或 Canvas filter。

/* 风模块：两个低频波叠加；始终朝右，不会反向。 */
class WindSystem {
  constructor(){this.value=.55;this.slope=.065+this.value*.19;this.gust=0;this.manual=0;}
  trigger(){this.manual=2.5;}
  update(t,dt){
    const c=CONFIG.wind,slow=.5+.5*Math.sin(TAU*t/c.gustPeriod),fast=.5+.5*Math.sin(TAU*t/c.secondaryPeriod+1.2);
    const u=clamp(this.manual/2.5,0,1),manual=.45*u*u*(3-2*u);
    this.gust=Math.max(Math.min(.45,c.gustAmount)*(.7*slow+.3*fast),manual);
    const turbulence=.08*(.65*Math.sin(t*4.1)+.35*Math.sin(t*7.3+1.7));
    this.value=Math.max(.4,(c.windBase+this.gust+turbulence)*c.strength/.65);
    this.slope=.065+this.value*.19;this.manual=Math.max(0,this.manual-(dt||0));
  }
}

/* 地面仅用三圈白色细线表示；所有落点共用此几何定义。 */
class GroundSurface {
  constructor(){this.geometry();}
  geometry(){const p=CONFIG.ground;this.x=p.x;this.y=p.y;this.rx=p.radiusX*p.size;this.ry=p.radiusY*p.size;}
  path(c){c.beginPath();c.ellipse(this.x,this.y,this.rx,this.ry,0,0,TAU);}
  contains(x,y){const dx=(x-this.x)/this.rx,dy=(y-this.y)/this.ry;return dx*dx+dy*dy<=1;}
  draw(c){const p=CONFIG.ground;c.save();c.strokeStyle='white';for(let i=0;i<p.scales.length;i++){c.globalAlpha=p.alphas[i];c.lineWidth=p.widths[i];c.shadowColor='white';c.beginPath();c.ellipse(this.x,this.y,this.rx*p.scales[i],this.ry*p.scales[i],0,0,TAU);c.stroke();}c.restore();}
}

/* 椭圆水面 + 通用倒影：先翻转离屏物体层，再分条折射，最后衰减。 */

  geometry(){const p=CONFIG.puddle,g=this.ground;this.x=p.x;this.y=p.y;const fit=Math.min(1,(g.rx-Math.abs(p.x-g.x))*0.90/(p.radiusX*p.size),(g.ry-Math.abs(p.y-g.y))*0.80/(p.radiusY*p.size));this.rx=p.radiusX*p.size*fit;this.ry=p.radiusY*p.size*fit;}

  reflect(c,source,baseline,t,ripples,x=0,top=0,alpha=.32){

}

/* 落点生成：景深决定前后位置，约30%的落点指定在水坑内。 */
class RainSystem {
  constructor(wind,ripples,splashes,ground,water){this.wind=wind;this.ripples=ripples;this.splashes=splashes;this.ground=ground;this.water=water;this.layers=CONFIG.rain.layers.map(()=>[]);this.sync();}
  landing(d,p){const g=this.ground,w=this.water;const inWater=Math.random()<CONFIG.rain.waterFraction;
    let zMin=p.zMin,zMax=p.zMax;
    if(inWater){const back=(w.y-w.ry*.94-g.y+g.ry)/(2*g.ry),front=(w.y+w.ry*.94-g.y+g.ry)/(2*g.ry);
      zMin=clamp(zMin,back,front);zMax=clamp(zMax,back,front);
      // 水坑调小后，最远/最近层仍在水坑后沿/前沿找到有效落点。
      if(zMax-zMin<0.01){if(p.zMax<back){zMin=back;zMax=Math.min(front,back+.04);}else{zMax=front;zMin=Math.max(back,front-.04);}}
    }
    d.z=zMin+Math.random()*(zMax-zMin);d.ground=g.y+(2*d.z-1)*g.ry;
    const dy=(d.ground-g.y)/g.ry,half=g.rx*Math.sqrt(Math.max(0,1-dy*dy))*.97;
    let lo=Math.max(12,g.x-half),hi=Math.min(W-12,g.x+half);
    if(inWater){const wy=(d.ground-w.y)/w.ry,wh=w.rx*Math.sqrt(Math.max(0,1-wy*wy))*.96;lo=Math.max(lo,w.x-wh);hi=Math.min(hi,w.x+wh);}
    // 干地落点从水坑左右区间中抽样，不靠反复重试碰运气。
    if(!inWater&&Math.abs(d.ground-w.y)<w.ry){const wh=w.rx*Math.sqrt(1-Math.pow((d.ground-w.y)/w.ry,2));const left=Math.max(0,Math.min(hi,w.x-wh)-lo),right=Math.max(0,hi-Math.max(lo,w.x+wh));const r=Math.random()*(left+right);d.targetX=r<left?lo+r:Math.max(lo,w.x+wh)+(r-left);}
    else d.targetX=lo+Math.random()*(hi-lo);
    d.water=this.water.contains(d.targetX,d.ground);
  }
  reset(d,layer,initial=false){const p=CONFIG.rain.layers[layer];this.landing(d,p);d.y=initial?Math.random()*d.ground:-50-Math.random()*260;d.speed=p.speed*(.86+Math.random()*.28);d.length=p.lengthMin+Math.random()*(p.lengthMax-p.lengthMin);d.width=p.width*(1+CONFIG.rain.widthJitter*(Math.random()*2-1));d.x=d.targetX-(d.ground-d.y)*this.wind.slope;}
  sync(retarget=false){const sum=CONFIG.rain.layers.reduce((n,l)=>n+l.count,0);CONFIG.rain.layers.forEach((p,i)=>{const target=Math.round(p.count*QUALITY.rain*Math.min(CONFIG.rain.density,CONFIG.rain.maxDrops/sum)*(MOBILE?CONFIG.rain.mobileCountScale:1)),a=this.layers[i];while(a.length<target){const d={};this.reset(d,i,true);a.push(d);}a.length=target;if(retarget)for(const d of a)this.reset(d,i,true);});}
  update(dt){for(let i=0;i<this.layers.length;i++)for(const d of this.layers[i]){d.y+=d.speed*dt;
    if(d.y>=d.ground){this.ripples.add(d.targetX,d.ground,d.z,d.water);this.splashes.add(d.targetX,d.ground,d.z,d.water);this.reset(d,i);}
    d.x=d.targetX-(d.ground-d.y)*this.wind.slope;
  }}
  draw(c,layer){const p=CONFIG.rain.layers[layer];c.save();c.lineCap='butt';for(let band=0;band<4;band++){const lo=band/4,hi=(band+1)/4;c.beginPath();c.strokeStyle='rgba(255,255,255,'+(p.alpha*(.08+.92*hi*hi))+')';c.lineWidth=p.width*(.35+.65*hi);for(const d of this.layers[layer]){if(d.y>=d.ground)continue;c.moveTo(d.x-d.length*(1-lo)*this.wind.slope,d.y-d.length*(1-lo));c.lineTo(d.x-d.length*(1-hi)*this.wind.slope,d.y-d.length*(1-hi));}c.stroke();}c.restore();}

}

/* 有界波包，近景偶尔出现延迟的第二圈；水面与干地强弱区分。 */
class RippleSystem {
  constructor(water,ground){this.pool=Array.from({length:131},()=>({}));this.cursor=0;this.items=[];this.water=water;this.ground=ground;}
  add(x,y,z,water){const p=CONFIG.ripples,a=this.items;if(a.length>=(MOBILE?p.mobileMaxCount:p.maxCount))a.shift();const record=this.pool[this.cursor++%131];Object.assign(record,{story:false,x,y,z,water,age:0,life:p.lifetime*(.85+Math.random()*.3),radius:(p.farRadius+(p.nearRadius-p.farRadius)*z)*(water?1:p.dryScale),rings:z>.65&&Math.random()<p.doubleChance?2:1});a.push(record);}
  update(dt){for(let i=this.items.length-1;i>=0;i--){this.items[i].age+=dt;if(this.items[i].age>this.items[i].life+CONFIG.ripples.doubleDelay)this.items.splice(i,1);}}
  draw(c,inWater){const p=CONFIG.ripples;c.save();this.ground.path(c);c.clip();if(inWater){this.water.path(c);c.clip();}c.strokeStyle='white';c.lineWidth=1;
    for(const r of this.items){if(r.water!==inWater)continue;for(let n=0;n<r.rings;n++){const age=r.age-n*p.doubleDelay;if(age<0||age>=r.life)continue;const f=age/r.life,radius=1+r.radius*(1-Math.pow(1-f,2));c.globalAlpha=clamp(p.waterAlpha*p.intensity*(inWater?1:p.dryScale)*(1-f)*(1-f)/(1+n*.6),0,1);c.beginPath();c.ellipse(r.x,r.y,radius,radius*p.flatten,0,0,TAU);c.stroke();}}
    c.restore();
  }
}

/* 落地闪点与3—6颗微小水珠，解析抛物线；回到落点高度即移除。 */
class SplashSystem {
  constructor(){this.items=[];this.flashes=[];this.pool=Array.from({length:501},()=>({}));this.flashPool=Array.from({length:81},()=>({}));this.cursor=0;this.flashCursor=0;}
  add(x,y,z,water){const p=CONFIG.splashes,scale=(.55+z*.65)*(water?1:CONFIG.ripples.dryScale),alpha=water?1:CONFIG.ripples.dryScale;

}

// 局部坐标中的 Verlet 链。丝带自由下垂，衣料用较短的链控制轮廓。
class FabricChain {
  constructor(count){this.points=Array.from({length:count},(_,i)=>({x:i*10,y:0,px:i*10,py:0}));}
  step(dt,length,wind,time,phase){
    const pts=this.points,spacing=length/(pts.length-1);
    for(let i=1;i<pts.length;i++){const q=pts[i],x=q.x,y=q.y;

      q.y+=(q.y-q.py)*.91+(100+wind*310*Math.sin(time*3-i*.43+phase))*dt*dt;

    for(let pass=0;pass<7;pass++)for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,k=(d-spacing)/d*(i===1?1:.5);if(i>1){a.x+=dx*k;a.y+=dy*k;}b.x-=dx*k;b.y-=dy*k;}
  }
}
function oval(c,x,y,rx,ry,fill){c.beginPath();c.ellipse(x,y,rx,ry,0,0,TAU);if(fill)c.fill();else c.stroke();}

    for(let i=1;i<=76;i++){const a=pts[i-1],b=pts[i],grad=c.createLinearGradient(b.ax,b.ay,b.bx,b.by);grad.addColorStop(0,b.face>0?'white':'#C6D7FF');grad.addColorStop(1,b.face>0?'#E8F0FF':'#E4EDFF');c.fillStyle=c.strokeStyle=grad;c.lineWidth=.6;c.beginPath();c.moveTo(a.ax,a.ay);c.lineTo(b.ax,b.ay);c.lineTo(b.bx,b.by);c.lineTo(a.bx,a.by);c.closePath();c.fill();c.stroke();if(Math.abs(b.face)<.17){c.strokeStyle='rgba(255,255,255,.8)';c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke();}}

class GlassBottle {

  setQuality(level,resize=true){QUALITY.level=clamp(Math.round(level),0,3);QUALITY.low=QUALITY.high=0;QUALITY.rain=[1,1,.75,.6][QUALITY.level];this.person.supersample=[1.5,1.25,1,1][QUALITY.level];this.person.high.width=Math.round(600*this.person.supersample);this.person.high.height=Math.round(840*this.person.supersample);const scale=[.5,1/3,.25,.25][QUALITY.level];this.bloomLayer.width=Math.round(W*scale);this.bloomLayer.height=Math.round(H*scale);this.bloomSmall.width=Math.round(W*scale/4);this.bloomSmall.height=Math.round(H*scale/4);this.rain.sync();this.effectsDirty=true;if(resize)this.resize();}
  draw(){const c=ctx,p=CONFIG.PERSON,b=CONFIG.BOTTLE,px=p.x-270,py=p.y-800,bx=b.x-120,by=b.y-410,m=this.meter;this.renderTick++;
    m.run(0,()=>{const key=CONFIG.ground.size+':'+CONFIG.puddle.size;if(key!==this.staticKey){const g=this.staticLayer.getContext('2d');this.environment.draw(g);this.ground.draw(g);this.water.drawBase(g);this.staticKey=key;}c.drawImage(this.staticLayer,0,0);});
    m.run(1,()=>this.tree.render());m.run(2,()=>this.person.render());m.run(3,()=>this.bottle.render());
    m.run(6,()=>{if(QUALITY.level===0||this.renderTick%2===0||this.effectsDirty){const low=QUALITY.level>=2,im=low?this.effectsLow:this.effectsLayer,g=im.getContext('2d');g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,im.width,im.height);g.save();if(low)g.scale(.5,.5);g.translate(0,-1100);
      this.light.draw(g,this.ground,this.tree.tint,0,0,CONFIG.TREE_BASE.y,.26);this.light.draw(g,this.ground,this.person.silhouette,px,py,p.y,.26);this.light.draw(g,this.ground,this.bottle.rim,bx,by,b.y,.14);
      g.save();this.ground.path(g);g.clip();g.fillStyle='rgba(255,255,255,.22)';oval(g,b.x+32,b.y+9,18,4,true);g.restore();this.water.reflect(g,this.tree.white,CONFIG.TREE_BASE.y,this.time,this.ripples.items);this.water.reflect(g,this.person.silhouette,p.y,this.time,this.ripples.items,px,py,.32);this.water.reflect(g,this.bottle.rim,b.y,this.time,this.ripples.items,bx,by,.40);g.restore();this.effectsDirty=false;}
      c.drawImage(QUALITY.level>=2?this.effectsLow:this.effectsLayer,0,1100,W,560);});
    m.run(4,()=>this.rain.draw(c,0));m.run(7,()=>{this.ripples.draw(c,false);this.ripples.draw(c,true);this.splashes.draw(c);});
    m.run(5,()=>{if(QUALITY.level!==3||this.renderTick%2===0){const g=this.bloomLayer.getContext('2d'),z=this.bloomSmall.getContext('2d');g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,this.bloomLayer.width,this.bloomLayer.height);g.save();g.scale(this.bloomLayer.width/W,this.bloomLayer.height/H);g.drawImage(this.tree.white,0,0);g.drawImage(this.person.silhouette,px,py);g.drawImage(this.bottle.rim,bx,by);g.restore();z.clearRect(0,0,this.bloomSmall.width,this.bloomSmall.height);z.drawImage(this.bloomLayer,0,0,this.bloomSmall.width,this.bloomSmall.height);g.clearRect(0,0,this.bloomLayer.width,this.bloomLayer.height);g.drawImage(this.bloomSmall,0,0,this.bloomLayer.width,this.bloomLayer.height);}c.save();c.globalCompositeOperation='lighter';c.globalAlpha=CONFIG.tree.bloom*.5;c.drawImage(this.bloomLayer,0,0,W,H);c.restore();});
    m.run(1,()=>c.drawImage(this.tree.layer,0,0));
    m.run(3,()=>{this.bottle.drawBack(c);this.bottle.drawInside(this.bottle.insideHook,c);this.bottle.drawFront(c);});
    m.run(2,()=>{this.person.drawContact(c);c.drawImage(this.person.layer,px,py);c.save();c.translate(px,py);this.person.drawTipEffects(c);c.restore();});
    m.run(1,()=>this.tree.loose(c));m.run(4,()=>this.rain.draw(c,1));m.run(7,()=>this.story.magic.draw(c,false,this.story));m.run(4,()=>this.rain.draw(c,2));}
  frame(now){const raw=this.last?Math.max(.001,(now-this.last)/1000):1/60,dt=clamp(raw,1/120,1/30);this.last=now;this.meter.begin();if(!this.paused&&!document.hidden){this.accumulator=Math.min(this.accumulator+dt,3/90);let steps=0;while(this.accumulator>=1/90&&steps<3){this.update(1/90);this.accumulator-=1/90;steps++;}this.draw();}this.meter.end(raw,this);requestAnimationFrame(t=>this.frame(t));}
  toggle(){this.paused=!this.paused;const b=document.querySelector('#pause');b.textContent=this.paused?'▶':'Ⅱ';b.setAttribute('aria-label',this.paused?'继续全部动画':'全局冻结');this.story.syncAudio();}
}
// Timing wrappers are installed once; no per-frame canvas or readback allocation.
let ACTIVE_METER=null;
function timed(proto,name,index){const fn=proto[name];proto[name]=function(){const start=performance.now(),v=fn.apply(this,arguments);if(ACTIVE_METER)ACTIVE_METER.current[index]+=performance.now()-start;return v;};}
for(const item of [[WindSystem,'update',1],[AppleTree,'update',1],[PhotoFigure,'update',2],[GlassBottle,'update',3],[RainSystem,'update',4],[MagicAudio,'tone',8],[MagicAudio,'noise',8]])timed(item[0].prototype,item[1],item[2]);
const scene=new Scene();ACTIVE_METER=scene.meter;window.tree=scene.tree;window.person=scene.person;window.bottle=scene.bottle;window.story=scene.story;
const inputs=[['wind',CONFIG.wind,'strength'],['rain',CONFIG.rain,'density'],['pool',CONFIG.puddle,'size'],['ground',CONFIG.ground,'size'],['ripple',CONFIG.ripples,'intensity'],['splash',CONFIG.splashes,'amount']];
const treeControls=[['seed','树种子',1,99999,1],['width','树冠宽度',.8,1.1,.01],['stiffness','枝条刚度',25,100,1],['gustAmount','阵风强度',0,.45,.01],['layers','叶团层数',5,7,1],['attractors','吸引点数量',4000,6000,100],['influence','影响半径',95,165,5],['clusters','叶团数量',220,320,1],['density','叶团疏密',.2,1,.05],['back','后层颜色',0,1,1],['outline','描边宽度',0,3,.1],['bloom','泛光强度',0,1,.01],['kx','投影横向系数',0,.7,.01],['ky','投影纵向系数',.03,.2,.01]];
treeControls.push(['detailLines','五官与衣褶细节',0,1,.01],['hairWeight','脑后发丝权重',0,1,.01],['robeWeight','后袍权重',0,1.5,.01],['hemAmplitude','袍摆幅度 A',12,56,1],['waveFrequency','行波频率',.4,2,.05],['springStiffness','布料弹簧刚度',30,180,1],['springDamping','布料弹簧阻尼',.04,.3,.01],['leanMax','上半身 lean 上限',0,8,.1],['windBase','持续风强度',.4,.8,.01],['windupTime','蓄力秒数',.1,.8,.01],['flickTime','挥出秒数',.06,.4,.01],['followTime','惯性秒数',.05,.5,.01],['returnTime','回落秒数',.2,1.2,.01],['bottleHeight','瓶高',280,370,1],['jarWidth','瓶身宽度',150,210,1],['shine','高光强度',.35,1.25,.01],['whiteness','玻璃白度',.2,1.8,.01],['twist','丝带扭转强度',.2,2,.01],['lift','丝带升力',0,2,.01],['neck','瓶口内径',30,49,1],['ribbon','长丝带长度',170,260,1],['PERSON_HEIGHT','人物身高',480,720,1],['cloth','袍子飘动强度',0,2,.05],['pose','人物姿态',0,1,.01]);
for(const [key,label,min,max,step] of treeControls){document.querySelector('#reset').insertAdjacentHTML('beforebegin','<label for="'+key+'">'+label+' <output id="'+key+'Value"></output></label><input id="'+key+'" type="'+(key==='back'?'color':key==='seed'?'number':'range')+'" min="'+min+'" max="'+max+'" step="'+step+'">');inputs.push([key,key in CONFIG.BOTTLE?CONFIG.BOTTLE:key in CONFIG.PERSON?CONFIG.PERSON:key==='gustAmount'||key==='windBase'?CONFIG.wind:CONFIG.tree,key]);}
const storyControls=[['manual','画质：-1自动 / 0最高 / 3保底',-1,3,1,QUALITY],['x','瓶子 x',560,640,1,CONFIG.BOTTLE],['treeFlash','撞树闪光',0,.14,.01,CONFIG.magic],['rebound','碰瓶回弹距离',0,8,.1,CONFIG.magic],['gap','循环间隔',0,8,.1,CONFIG.story],['contactTime','接触时间',.48,.8,.01,CONFIG.story],['chargeTime','蓄魔法时间',.2,.5,.01,CONFIG.story],['flightB','回弹飞行时长',.2,1.5,.01,CONFIG.story],['p1Normal','反射控制点距离',0,180,1,CONFIG.magic],['p1Y','反射控制点竖向',-250,0,1,CONFIG.magic],['p2X','树侧控制点横向',-200,100,1,CONFIG.magic],['p2Y','树侧控制点竖向',0,300,1,CONFIG.magic],['trailLength','拖尾长度',80,220,1,CONFIG.magic],['sparkCount','细闪数量',0,2,.1,CONFIG.magic],['ballSize','蓄满核心半径',8,20,.1,CONFIG.magic],['impactHeight','瓶身撞击高度',.1,.29,.01,CONFIG.magic],['impactX','树冠撞击点 x',350,850,1,CONFIG.magic],['impactY','树冠撞击点 y',250,650,1,CONFIG.magic],['shakeStrength','撞树摇晃强度',0,1,.01,CONFIG.magic],['masterVolume','总音量',0,1,.01,CONFIG.audio],['bellVolume','魔法音',0,1,.01,CONFIG.audio],['glassVolume','玻璃音',0,1,.01,CONFIG.audio],['leafVolume','树叶声',0,1,.01,CONFIG.audio]];
for(const [key,label,min,max,step,obj] of storyControls){document.querySelector('#reset').insertAdjacentHTML('beforebegin','<label for="'+key+'">'+label+' <output id="'+key+'Value"></output></label><input id="'+key+'" type="range" min="'+min+'" max="'+max+'" step="'+step+'">');inputs.push([key,obj,key]);}
const defaults=inputs.map(row=>row[1][row[2]]);
function refreshInputs(){for(const [id,obj,key] of inputs){document.getElementById(id).value=obj[key];document.getElementById(id+'Value').textContent=(key==='back'?obj[key]:obj[key].toFixed(2));}}
for(const [id,obj,key] of inputs)document.getElementById(id).addEventListener('input',e=>{obj[key]=key==='back'?e.target.value:clamp(Number(e.target.value),Number(e.target.min),Number(e.target.max));if(id==="manual"){scene.setQuality(obj[key]<0?(MOBILE?1:0):obj[key]);}if(id==="x")scene.story.calibrated=true;if(id==="pose"){scene.story.stopForTest();scene.person.setPose(obj[key]);}if(obj===CONFIG.audio)scene.story.audio.apply();if(["seed","width","layers","attractors","influence","clusters","density","back","outline"].includes(id))scene.tree.generate();document.getElementById(id+'Value').textContent=(key==='back'?obj[key]:obj[key].toFixed(2));if(id==='ground'||id==='pool'){scene.ground.geometry();scene.water.geometry();scene.ripples.items.length=0;scene.splashes.items.length=0;scene.splashes.flashes.length=0;scene.rain.sync(true);}else scene.rain.sync();scene.draw();});
document.querySelector('#reset').onclick=()=>{inputs.forEach((row,i)=>row[1][row[2]]=defaults[i]);scene.tree.generate();CONFIG.wind.strength=.65;CONFIG.rain.density=.78;CONFIG.puddle.size=1;CONFIG.ground.size=1;CONFIG.ripples.intensity=1;CONFIG.splashes.amount=1;scene.story.audio.apply();scene.story.calibrated=false;scene.setQuality(QUALITY.manual<0?(MOBILE?1:0):QUALITY.manual);refreshInputs();scene.ground.geometry();scene.water.geometry();scene.ripples.items.length=0;scene.splashes.items.length=0;scene.splashes.flashes.length=0;scene.rain.sync(true);scene.draw();};
document.querySelector('#reset').insertAdjacentHTML('beforebegin','<label>帧率面板 <input id="perfToggle" type="checkbox"></label><p id="qualityStatus"></p>');document.getElementById('perfToggle').onchange=()=>scene.meter.toggle();
document.querySelector('#pause').onclick=()=>scene.toggle();document.querySelector('#mute').onclick=()=>{scene.story.audio.unlock();scene.story.audio.toggleMute();};// pointerup 同时覆盖鼠标/触屏；手势拖动、多指和取消不触发暂停。
let pointerStart=null;
function startPointer(e){if(e.isPrimary===false||e.button>0)return;pointerStart={id:e.pointerId,x:e.clientX,y:e.clientY};}
function endPointer(e){if(!pointerStart||pointerStart.id!==e.pointerId)return;const dx=e.clientX-pointerStart.x,dy=e.clientY-pointerStart.y;pointerStart=null;if(dx*dx+dy*dy<100){if(scene.person.cal)scene.person.calibrate(e);else scene.story.audio.unlock();}}
if(window.PointerEvent){canvas.addEventListener('pointerdown',startPointer);canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',()=>{pointerStart=null;});}
else{canvas.addEventListener('click',e=>scene.person.cal?scene.person.calibrate(e):scene.story.audio.unlock());}
document.addEventListener('touchmove',e=>{if(e.target.tagName!=='INPUT'&&!document.getElementById('debug').contains(e.target))e.preventDefault();},{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
let hideUI=false;window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const actor=scene.person;scene.story.audio.unlock();if(e.repeat&&['Space','KeyM'].includes(e.code))return;if(e.code==='KeyM'){scene.story.audio.unlock();scene.story.audio.toggleMute();}if(e.code==='KeyV'){scene.story.stopForTest();actor.loop=!actor.loop;if(actor.loop)actor.playCast();}if(e.code==='KeyX'){actor.compare=!actor.compare;actor.cal=null;}if(e.code==='KeyF')actor.heat=!actor.heat;if(e.code==='KeyP'){if(e.shiftKey)actor.saveTips();else scene.meter.toggle();}if(e.code==='KeyW'){scene.story.stopForTest();actor.loop=false;actor.compare=false;actor.cal=actor.cal==='idle'?'flick':actor.cal==='flick'?null:'idle';actor.setPose(actor.cal==='flick'?1:0);refreshInputs();}if(['KeyW','KeyX','KeyF'].includes(e.code))scene.draw();if(e.code==='KeyB')scene.bottle.pulse(1);if(e.code==='KeyC'){scene.story.stopForTest();scene.person.playCast();}if(e.code==='KeyG')scene.wind.trigger();if(e.code==='KeyN'){CONFIG.tree.seed=1+Math.floor(Math.random()*99999);scene.tree.generate();refreshInputs();scene.draw();}if(e.code==='KeyT'){scene.tree.shake(.8);scene.draw();}if(e.code==='KeyD'){if(hideUI){hideUI=false;document.querySelector('#controls').classList.remove('hidden');}document.querySelector('#debug').classList.toggle('hidden');}if(e.code==='KeyH'){hideUI=!hideUI;scene.hideHints=hideUI;document.querySelector('#controls').classList.toggle('hidden',hideUI);document.querySelector('#soundControl').classList.toggle('hidden',hideUI);scene.meter.panel.style.display=hideUI?'none':scene.meter.visible?'block':'none';if(hideUI)document.querySelector('#debug').classList.add('hidden');document.querySelector('#hint').style.opacity=0;}if(e.code==='KeyS'){document.querySelector('#safeArea').classList.toggle('hidden');}if(e.code==='Space'){e.preventDefault();scene.story.interact();}});
document.addEventListener('visibilitychange',()=>{scene.last=0;scene.accumulator=0;QUALITY.low=QUALITY.high=0;scene.meter.elapsed=scene.meter.count=scene.meter.work=0;scene.story.hidden=document.hidden;scene.story.syncAudio();});document.addEventListener('pointerdown',()=>scene.story.audio.unlock(),{once:true});document.addEventListener('touchstart',()=>scene.story.audio.unlock(),{once:true});refreshInputs();setTimeout(()=>document.querySelector('#hint').style.opacity=0,CONFIG.ui.hintSeconds*1000);
